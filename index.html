<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlock Content</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; padding: 20px; }
        .box { background: #1e1e1e; padding: 25px; border-radius: 14px; text-align: center; width: 100%; max-width: 360px; box-shadow: 0 8px 20px rgba(0,0,0,0.5); }
        h3 { color: #0088cc; margin-bottom: 10px; }
        p { font-size: 14px; color: #ccc; margin-bottom: 15px; }
        .timer { font-size: 22px; color: #ffcc00; margin: 15px 0; font-weight: bold; }
        .btn { background: #0088cc; color: #fff; border: none; padding: 14px; font-size: 16px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; transition: 0.3s; }
        .btn:disabled { background: #444; color: #888; cursor: not-allowed; }
        .ad-btn { background: #e94560; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="box">
    <h3>কন্টেন্ট আনলক করুন</h3>
    <p>ফাইলটি পেতে ১৫ সেকেন্ড অপেক্ষা করুন।</p>

    <!-- অ্যাড দেখার বাটন (যদি আপনার ডায়রেক্ট অ্যাড লিঙ্ক থাকে) -->
    <button class="btn ad-btn" onclick="openAdLink()">📢 বিজ্ঞাপন দেখতে এখানে চাপুন</button>
    
    <div id="timer" class="timer">⏱️ ১৫ সেকেন্ড বাকি</div>
    
    <button id="getLinkBtn" class="btn" disabled onclick="redirectToBot()"> Get Link (আনলক করুন)</button>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // URL Param থেকে File ID এবং Bot Username গ্রহণ
    const urlParams = new URLSearchParams(window.location.search);
    const fileId = urlParams.get('file_id');
    const botUsername = urlParams.get('bot');

    let timeLeft = 15;
    const timerElem = document.getElementById('timer');
    const btnElem = document.getElementById('getLinkBtn');

    // আপনার অ্যাড নেটওয়ার্কের ডাইরেক্ট লিঙ্ক (প্রয়োজন হলে এখানে বসান)
    const AD_DIRECT_LINK = "https://your-ad-network-direct-link.com"; 

    function openAdLink() {
        if(AD_DIRECT_LINK !== "https://www.profitableratecpmnetwork.com/tqt92rh5?key=21adb80033cc3b33a606220533d7ee2a") {
            window.open(AD_DIRECT_LINK, '_blank');
        }
    }

    // ১৫ সেকেন্ডের কাউন্টডাউন টাইমার
    const countdown = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
            timerElem.innerText = `⏱️ ${timeLeft} সেকেন্ড বাকি`;
        } else {
            clearInterval(countdown);
            timerElem.innerText = "✅ ভিডিও আনলক করার জন্য তৈরি!";
            timerElem.style.color = "#4ecca3";
            btnElem.disabled = false;
        }
    }, 1000);

    // বটের কাছে ফেরত যাওয়ার ফাংশন
    function redirectToBot() {
        if (fileId && botUsername) {
            const redirectUrl = `https://t.me/${botUsername}?start=unlock_${fileId}`;
            tg.openTelegramLink(redirectUrl);
            tg.close();
        } else {
            alert("ত্রুটি: ফাইলের সঠিক আইডেন্টিফায়ার পাওয়া যায়নি!");
        }
    }
</script>

</body>
</html>
