<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlock Content</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; padding: 20px; }
        .box { background: #1e1e1e; padding: 25px; border-radius: 14px; text-align: center; width: 100%; max-width: 360px; box-shadow: 0 8px 20px rgba(0,0,0,0.5); }
        h3 { color: #0088cc; margin-bottom: 10px; }
        p { font-size: 14px; color: #ccc; margin-bottom: 15px; }
        .timer { font-size: 20px; color: #ffcc00; margin: 15px 0; font-weight: bold; }
        .btn { background: #0088cc; color: #fff; border: none; padding: 14px; font-size: 16px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; transition: 0.3s; }
        .btn:disabled { background: #444; color: #888; cursor: not-allowed; }
        .ad-btn { background: #e94560; margin-bottom: 10px; animation: pulse 1.5s infinite; }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="box">
    <h3>🔒 কন্টেন্ট আনলক করুন</h3>
    <p id="instruction">ফাইলটি পেতে প্রথমে নিচের বিজ্ঞাপনে ক্লিক করুন।</p>

    <!-- ১. অ্যাড দেখার বাধ্যতামূলক বাটন -->
    <button id="adBtn" class="btn ad-btn" onclick="openAdAndStartTimer()">📢 বিজ্ঞাপন দেখতে এখানে চাপুন</button>
    
    <!-- টাইমার মেসেজ -->
    <div id="timer" class="timer" style="display:none;">⏱️ ১৫ সেকেন্ড অপেক্ষা করুন...</div>
    
    <!-- ২. গেট লিঙ্ক বাটন (প্রথমে বন্ধ থাকবে) -->
    <button id="getLinkBtn" class="btn" disabled onclick="redirectToBot()"> Get Link (আনলক করুন)</button>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // 🔗 এখানে আপনার আসল SMART LINK/DIRECT LINK টি বসান
    const AD_DIRECT_LINK = "https://www.profitableratecpmnetwork.com/tqt92rh5?key=21adb80033cc3b33a606220533d7ee2a"; 

    // URL Param থেকে ডাটা নেয়া
    const urlParams = new URLSearchParams(window.location.search);
    const fileId = urlParams.get('file_id');
    const botUsername = urlParams.get('bot');

    let isAdClicked = false;
    let timeLeft = 15;

    function openAdAndStartTimer() {
        if (!AD_DIRECT_LINK || AD_DIRECT_LINK.includes("your-smart-link-here")) {
            alert("⚠️ এডমিন এখনও স্মার্ট লিঙ্ক সেটআপ করেনি!");
            return;
        }

        // বিজ্ঞাপনে নিয়ে যাওয়া
        tg.openLink(AD_DIRECT_LINK);
        isAdClicked = true;

        // ইউজার ইন্টারফেস আপডেট
        document.getElementById('adBtn').style.display = 'none';
        document.getElementById('instruction').innerText = "বিজ্ঞাপন দেখা হচ্ছে... ১৫ সেকেন্ড অপেক্ষা করুন।";
        const timerElem = document.getElementById('timer');
        timerElem.style.display = 'block';

        // টাইমার চালু করা
        const countdown = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                timerElem.innerText = `⏱️ ${timeLeft} সেকেন্ড বাকি...`;
            } else {
                clearInterval(countdown);
                timerElem.innerText = "✅ ফাইল আনলক সফল হয়েছে!";
                timerElem.style.color = "#4ecca3";
                
                // টাইমার শেষ এবং অ্যাডে ক্লিক সফল হলে Get Link সক্রিয় করা
                document.getElementById('getLinkBtn').disabled = false;
            }
        }, 1000);
    }

    // বটের কাছে ফেরত যাওয়া
    function redirectToBot() {
        if (!isAdClicked) {
            alert("⚠️ আগে বিজ্ঞাপনে ক্লিক করে অপেক্ষা করুন!");
            return;
        }

        if (fileId && botUsername) {
            const redirectUrl = `https://t.me/${botUsername}?start=unlock_${fileId}`;
            tg.openTelegramLink(redirectUrl);
            tg.close();
        } else {
            alert("❌ ত্রুটি: ফাইলের লিঙ্ক পাওয়া যায়নি!");
        }
    }
</script>

</body>
</html>
