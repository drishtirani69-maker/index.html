<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Unlock Content</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: var(--tg-theme-bg-color, #0f172a);
            color: var(--tg-theme-text-color, #f8fafc);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #1e293b);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        h2 {
            font-size: 20px;
            margin-bottom: 8px;
            color: #38bdf8;
        }
        p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .timer-box {
            font-size: 32px;
            font-weight: bold;
            color: #f59e0b;
            margin: 15px 0;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-ad {
            background: #2563eb;
            color: #ffffff;
        }
        .btn-ad:hover {
            background: #1d4ed8;
        }
        .btn-verify {
            background: #10b981;
            color: #ffffff;
            display: none;
        }
        .btn-verify:hover {
            background: #059669;
        }
        .btn:disabled {
            background: #475569;
            cursor: not-allowed;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon">🎬</div>
        <h2>Video Content Unlock</h2>
        <p id="instruction">ভিডিওটি আনলক করতে নিচের বোতামে ক্লিক করে স্পন্সর অ্যাডটি দেখুন।</p>
        
        <div id="timer" class="timer-box" style="display: none;">15</div>

        <button id="adBtn" class="btn btn-ad" onclick="openAd()">🚀 Watch Ad to Unlock</button>
        <button id="verifyBtn" class="btn btn-verify" onclick="verifyAndGetFile()">✅ Get Video File</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // URL Parameter থেকে Smart Ad Link রিসিভ করা
        const urlParams = new URLSearchParams(window.location.search);
        const adLink = urlParams.get('ad_link') || "https://google.com";

        let countdown = 15;
        let timerInterval = null;
        let adOpened = false;

        function openAd() {
            // অ্যাড ওপেন করা
            tg.openLink(adLink);
            adOpened = true;

            document.getElementById('instruction').innerText = "১৫ সেকেন্ড অপেক্ষা করুন, টাইমার শেষ হলে ফাইল আনলক হবে।";
            document.getElementById('adBtn').style.display = 'none';
            document.getElementById('timer').style.display = 'block';

            // টাইমার চালুকরণ
            timerInterval = setInterval(() => {
                countdown--;
                document.getElementById('timer').innerText = countdown;

                if (countdown <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('timer').style.display = 'none';
                    document.getElementById('instruction').innerText = "অ্যাড দেখা সম্পন্ন হয়েছে! ফাইল নিতে নিচের বোতামে চাপ দিন।";
                    document.getElementById('verifyBtn').style.display = 'block';
                }
            }, 1000);
        }

        function verifyAndGetFile() {
            if (!adOpened) {
                alert("দয়া করে প্রথমে বিজ্ঞাপনটি দেখুন!");
                return;
            }

            // সিকিউরিটির জন্য Telegram WebApp InitData পাঠানো
            const dataPayload = {
                status: "VERIFIED_AD_WATCHED",
                initData: tg.initData
            };

            // বটের কাছে ব্যাকএন্ডে ডাটা প্রেরণ
            tg.sendData(JSON.stringify(dataPayload));
            
            // অ্যাপ বন্ধ করা
            tg.close();
        }
    </script>
</body>
</html>
